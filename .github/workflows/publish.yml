name: Publicar Cantera G4
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cantera-g4-pages
  cancel-in-progress: false
jobs:
  publicar:
    if: github.event_name != 'schedule' || vars.FFCV_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sincronizador y datos sin conexión a FFCV
        run: |
          node --check scripts/sync_ffcv.mjs
          node --check client/har-import.js
          node scripts/check-html.mjs
          node --test tests/*.test.mjs
      - name: Sincronizar las nueve jornadas
        if: vars.FFCV_SYNC_ENABLED == 'true'
        run: node scripts/sync_ffcv.mjs --write
      - name: Preparar sitio público
        run: |
          mkdir -p dist/data dist/icons dist/client
          cp index.html sw.js manifest.webmanifest dist/
          cp data/league.json dist/data/
          cp icons/icon.svg dist/icons/
          cp client/har-import.js dist/client/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar en GitHub Pages
        uses: actions/deploy-pages@v4

  diagnostico_portada_ffcv:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar acceso web público FFCV sin consultar API
        run: |
          node --input-type=module -e '
            const u="https://ffcv.es/competiciones/";
            try{
              const res=await fetch(u,{signal:AbortSignal.timeout(12000)});
              console.log("GET portada FFCV: HTTP",res.status);
              if(res.ok){
                const body=await res.text();
                console.log("HTML recibido:",body.length,"caracteres");
                console.log("Referencia a cabecera de página:",body.includes("x-ffcv-page-token"));
                console.log("Referencia a token:",/page[-_]?token|pageToken/i.test(body));
                for(const m of body.matchAll(/page[-_]?token|pageToken/gi)){
                  let clip=body.slice(Math.max(0,m.index-90),Math.min(body.length,m.index+180));
                  clip=clip.replace(/[0-9a-f]{40,}/gi,"[REDACTED]");
                  console.log("HTML token surroundings:",clip.slice(0,260));
                }
              }
            }catch(e){console.log("GET portada no disponible:",e.message);process.exitCode=1}
          '
