name: Publicar Cantera G4
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Días laborables: mañana y tarde (horarios UTC).
    - cron: "20 7,17 * * 1-5"
    # Sábados y domingos: cinco actualizaciones durante el día.
    - cron: "20 7,10,13,16,19 * * 6,0"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cantera-g4-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar código y pruebas
        run: |
          node --check scripts/sync_ffcv.mjs
          node --check client/har-import.js
          node scripts/check-html.mjs
          node --test tests/*.test.mjs
      - name: Descargar y validar las nueve jornadas desde FFCV
        run: node scripts/sync_ffcv.mjs --write
      - name: Preparar sitio público
        run: |
          mkdir -p dist/data dist/icons dist/client
          cp index.html sw.js manifest.webmanifest dist/
          cp data/league.json dist/data/
          cp icons/icon.svg dist/icons/
          cp client/har-import.js dist/client/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar en GitHub Pages
        uses: actions/deploy-pages@v4
